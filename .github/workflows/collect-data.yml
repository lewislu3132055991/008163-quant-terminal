name: Collect public research data

on:
  workflow_dispatch:
  schedule:
    # UTC = Beijing time - 8h: 08:17, 14:37, 15:23, 21:17.
    - cron: "17 0 * * 1-5"
    - cron: "37 6 * * 1-5"
    - cron: "23 7 * * 1-5"
    - cron: "17 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: public-data-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/collect_data.py
      - name: Prepare GitHub Pages data directory
        run: |
          rm -rf data
          cp -r public/data data
      - name: Validate decision-data coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("data/data-health.json").read_text(encoding="utf-8"))
          completeness = health.get("completeness", 0)
          if completeness < 80:
              raise SystemExit(f"Decision-data coverage is only {completeness}%")
          print(f"Decision-data coverage: {completeness}%")
          PY
      - name: Commit changed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data
          git diff --cached --quiet || git commit -m "data: refresh public research snapshots"
          git push
